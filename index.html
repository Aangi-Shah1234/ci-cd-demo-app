<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My CI/CD App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 45px 35px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 50px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
            margin-bottom: 22px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #fff;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.6); opacity: 0.5; }
        }

        h1 {
            font-size: 2.1rem;
            font-weight: 800;
            background: linear-gradient(135deg, #4f46e5, #9333ea, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            line-height: 1.25;
        }

        p.desc {
            font-size: 1.1rem;
            color: #4b5563;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .pipeline-tags {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding-top: 15px;
            border-top: 1px solid #e5e7eb;
        }

        .tag {
            padding: 7px 15px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .tag-source { background: #e0f2fe; color: #0284c7; }
        .tag-build { background: #fef3c7; color: #d97706; }
        .tag-deploy { background: #ede9fe; color: #7c3aed; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">
            <span class="pulse-dot"></span>
            Live Deployment
        </div>
        <h1>Deployed via AWS CodePipeline!</h1>
        <p class="desc">This page was automatically built and deployed through the automated CI/CD pipeline.</p>
        <div class="pipeline-tags">
            <span class="tag tag-source">📦 GitHub / S3</span>
            <span class="tag tag-build">⚡ CodeBuild</span>
            <span class="tag tag-deploy">🚀 CodeDeploy</span>
        </div>
    </div>
</body>
</html>
